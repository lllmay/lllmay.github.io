<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ميّ عبدالعزيز</title>
<meta name="description" content="ميّ عبدالعزيز — أخصائية تسويق. مختارات من الحملات والعلامات التجارية.">
<meta property="og:title" content="ميّ عبدالعزيز | Marketing Specialist">
<meta property="og:description" content="استكشف أرشيف الحملات والعلامات التجارية.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M8 26a8 8 0 0 1 8-8h22l10 10h36a8 8 0 0 1 8 8v40a8 8 0 0 1-8 8H16a8 8 0 0 1-8-8z' fill='%231C1C1E'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;
  --text:#0B0B0C;
  --muted:#5E6570;
  --soft:#9AA3AD;
  --line:rgba(11,11,12,.08);
  --card:#F4FAFE;
  --sky:#3FAEEA;
  --sky-2:#8FD3F7;
  --sky-soft:#E8F6FE;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:auto}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
img,video{display:block;max-width:100%}
.en{font-family:'Inter',sans-serif;direction:ltr;display:inline-block}
.wrap{width:min(1200px,100% - 40px);margin-inline:auto}

/* ---------- Nav ---------- */
header{position:fixed;top:0;inset-inline:0;z-index:50;transition:background .4s}
header.solid{background:rgba(255,255,255,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav{height:68px;display:flex;align-items:center;justify-content:space-between}
.brand-mark{font-weight:600;font-size:1rem}
.menu{display:flex;gap:30px;font-size:.92rem;color:var(--muted)}
.menu a{position:relative;padding:4px 0;transition:color .3s}
.menu a:hover,.menu a.active{color:var(--text)}
.menu a.active::after{content:"";position:absolute;bottom:-2px;inset-inline:0;height:2px;background:var(--sky);border-radius:2px}
.burger{display:none;background:none;border:none;font-size:1.3rem;color:var(--text)}

/* ---------- Page transitions ---------- */
#app{min-height:100vh}
.page{animation:pageIn .7s var(--ease) both}
@keyframes pageIn{from{opacity:0;transform:translateY(18px)}}
.page.leaving{animation:pageOut .35s ease both}
@keyframes pageOut{to{opacity:0;transform:translateY(-10px)}}
.section{padding:130px 0 90px}
.eyebrow{font-size:.85rem;color:var(--sky);font-weight:500;letter-spacing:.5px;margin-bottom:14px;display:block}
.eyebrow .en{letter-spacing:2px;font-size:.75rem;text-transform:uppercase}
h1.title{font-size:clamp(2.2rem,5vw,3.6rem);font-weight:600;line-height:1.25;letter-spacing:-.5px}
.lead{font-size:1.1rem;color:var(--muted);line-height:2;max-width:640px;margin-top:18px}
.up{opacity:0;transform:translateY(22px);animation:up .9s var(--ease) forwards}
@keyframes up{to{opacity:1;transform:none}}

/* ---------- Folder ---------- */
.folder{
  --c:#F5C84C;
  width:var(--w,96px);background:none;border:none;color:var(--text);
  display:flex;flex-direction:column;align-items:center;gap:10px;
  transition:transform .5s var(--ease);perspective:600px;
}
.f-body{position:relative;width:100%;aspect-ratio:1.28}
.f-back{
  position:absolute;inset:0;border-radius:7% / 9%;
  background:color-mix(in srgb,var(--c) 78%,#000);
}
.f-back::before{ /* tab */
  content:"";position:absolute;top:-9%;right:0;width:42%;height:22%;
  background:inherit;border-radius:8px 8px 0 0;
}
.f-paper{
  position:absolute;inset:10% 8% 14%;background:#fff;border-radius:4px;
  box-shadow:0 1px 2px rgba(0,0,0,.08);transition:transform .5s var(--ease);
}
.f-paper.p2{inset:14% 12% 14%;background:#F7F7F5;transform:rotate(-3deg)}
.f-front{
  position:absolute;left:0;right:0;bottom:0;height:78%;border-radius:7% / 11%;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 92%,#fff) 0%,var(--c) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 22px -8px color-mix(in srgb,var(--c) 70%,#000);
  transform-origin:bottom center;transition:transform .55s var(--ease);
  display:grid;place-items:center;overflow:hidden;
}
.f-front .f-logo{font-family:'Inter','IBM Plex Sans Arabic',sans-serif;font-weight:700;font-size:calc(var(--w,96px) * .16);color:rgba(255,255,255,.9);letter-spacing:.5px;text-shadow:0 1px 2px rgba(0,0,0,.12)}
.f-front .f-logo img{height:calc(var(--w,96px) * .4);width:auto;max-width:calc(var(--w,96px) * .62);object-fit:contain;margin:auto;filter:brightness(0) invert(1);opacity:.95}
.f-front .f-logo img.raw{filter:none;opacity:1;width:calc(var(--w,96px) * .44);height:auto;max-width:none;max-height:none;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.f-shadow{position:absolute;bottom:-12%;left:10%;right:10%;height:14%;border-radius:50%;background:rgba(0,0,0,.18);filter:blur(8px);transition:.5s var(--ease)}
.f-label{font-size:.85rem;font-weight:500;line-height:1.4;text-align:center;padding:2px 8px;border-radius:6px;transition:.3s}
.folder:hover{transform:translateY(-6px)}
.folder:hover .f-front{transform:rotateX(-24deg)}
.folder:hover .f-paper{transform:translateY(-14%)}
.folder:hover .f-paper.p2{transform:translateY(-8%) rotate(-5deg)}
.folder:hover .f-shadow{opacity:.6;transform:scale(.9)}
.folder:hover .f-label{background:var(--hl,var(--c));color:#fff}
.folder:hover .f-label small{color:rgba(255,255,255,.85)}
.folder.opening{transform:scale(1.15)}
.folder.opening .f-front{transform:rotateX(-75deg)}
.folder.opening .f-paper{transform:translateY(-40%)}
.folder:focus-visible{outline:2px solid var(--text);outline-offset:8px;border-radius:12px}

/* ---------- Home ---------- */
.hero{min-height:100vh;position:relative;display:grid;place-items:center;overflow:hidden;padding:90px 20px 120px}
.hero-center{text-align:center;position:relative;z-index:2;max-width:760px}
.hero-name{font-size:clamp(3rem,8vw,6.2rem);font-weight:700;letter-spacing:-1.5px;line-height:1.1}
.hero-role{display:flex;justify-content:center;gap:clamp(20px,6vw,90px);font-size:clamp(1.05rem,2vw,1.4rem);color:var(--muted);margin-top:14px;flex-wrap:wrap}
.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:28px}
.chip{padding:7px 16px;border-radius:100px;background:var(--card);border:1px solid var(--line);font-size:.82rem;color:var(--muted);backdrop-filter:blur(8px)}
.scatter{position:absolute;inset:0;z-index:1}
.scatter .folder{position:absolute;--w:96px;animation:drift 7s ease-in-out infinite}
.scatter .folder:nth-child(2n){animation-delay:-3s}
.scatter .folder:nth-child(3n){animation-delay:-5s;animation-duration:8s}
@keyframes drift{50%{translate:0 -10px}}
.scroll-cue{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);text-align:center;z-index:2;font-size:.7rem;color:var(--soft);letter-spacing:2px}
.scroll-cue i{display:block;width:20px;height:32px;border:1.5px solid var(--soft);border-radius:12px;margin:8px auto 0;position:relative}
.scroll-cue i::after{content:"";position:absolute;top:6px;left:50%;width:3px;height:6px;margin-left:-1.5px;background:var(--soft);border-radius:2px;animation:wheel 1.8s infinite}
@keyframes wheel{to{transform:translateY(10px);opacity:0}}

.about{display:grid;grid-template-columns:1fr 1.3fr;gap:80px;align-items:start}
.about-photo{aspect-ratio:4/5;border-radius:28px;background:#E2E2DF;display:grid;place-items:center;color:var(--soft);font-size:.9rem;overflow:hidden;position:sticky;top:100px}
.about-photo img{width:100%;height:100%;object-fit:cover}
.about p{font-size:1.08rem;line-height:2.1;color:#3A3A3C;margin-bottom:22px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}
.fact b{font-family:'Inter';font-size:2rem;font-weight:600;display:block;direction:ltr;text-align:right}
.fact span{font-size:.85rem;color:var(--muted)}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:40px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:100px;font-size:.95rem;font-weight:500;border:1px solid var(--text);transition:.35s var(--ease)}
.btn.dark{background:var(--text);color:#fff}
.btn.dark:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(0,0,0,.18)}
.btn.ghost:hover{background:var(--text);color:#fff}

/* ---------- Services ---------- */
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:60px}
.svc{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:34px 30px;transition:.5s var(--ease);position:relative;overflow:hidden;opacity:0;animation:up .9s var(--ease) forwards}
.svc:hover{transform:translateY(-8px);background:#fff;box-shadow:0 24px 50px -20px rgba(0,0,0,.18)}
.svc .num{font-family:'Inter';font-size:.8rem;color:var(--soft);letter-spacing:2px}
.svc .ic{width:52px;height:52px;border-radius:16px;background:var(--text);color:#fff;display:grid;place-items:center;margin:26px 0 22px}
.svc .ic svg{width:24px;height:24px}
.svc h3{font-size:1.2rem;font-weight:600;margin-bottom:10px}
.svc p{font-size:.95rem;color:var(--muted);line-height:1.95}

/* ---------- Work (folders desk) ---------- */
.desk-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}
.desk-head .count{font-size:.9rem;color:var(--muted)}
.desk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:50px 24px;margin-top:70px;justify-items:center}
.desk .folder{--w:124px;opacity:0;animation:pop .8s var(--ease) forwards}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.9)}to{opacity:1;transform:none}}
.desk .folder .f-label{font-size:.95rem}
.desk .folder small{display:block;font-size:.75rem;color:var(--muted);font-weight:400}

/* ---------- Breadcrumb & brand switcher ---------- */
.crumbs{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);flex-wrap:wrap;margin-bottom:34px}
.crumbs a:hover{color:var(--text)}
.crumbs .sep{opacity:.5}
.crumbs .cur{color:var(--text)}
.switcher{margin-top:68px;position:sticky;top:68px;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.switcher .wrap{display:flex;gap:6px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.switcher .wrap::-webkit-scrollbar{display:none}
.sw{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 12px;border-radius:100px;font-size:.85rem;color:var(--muted);white-space:nowrap;transition:.3s;border:1px solid transparent}
.sw:hover{color:var(--text);background:var(--card)}
.sw.on{color:var(--text);background:#fff;border-color:var(--line)}
.sw i{width:14px;height:11px;border-radius:2px;background:var(--c);position:relative}
.sw i::before{content:"";position:absolute;top:-3px;right:0;width:6px;height:4px;background:inherit;border-radius:2px 2px 0 0}

/* ---------- Brand page ---------- */
.brand-hero{display:grid;grid-template-columns:auto 1fr;gap:44px;align-items:center;padding-bottom:50px;border-bottom:1px solid var(--line)}
.brand-logo{width:130px;height:130px;border-radius:32px;background:var(--c);display:grid;place-items:center;color:#fff;font-family:'Inter';font-weight:700;font-size:1.5rem;box-shadow:0 24px 50px -18px var(--c);overflow:hidden}
.brand-logo img{width:70%;height:70%;object-fit:contain}
.brand-logo[style*="transparent"] img{width:100%;height:100%}
.brand-hero h1{font-size:clamp(2.2rem,5vw,3.4rem);font-weight:700;line-height:1.2}
.brand-hero .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.brand-hero p{color:var(--muted);line-height:2;margin-top:14px;max-width:680px}
.camp-head{display:flex;justify-content:space-between;align-items:baseline;margin:60px 0 26px}
.camp-head h2{font-size:1.5rem;font-weight:600}
.camp-head span{color:var(--muted);font-size:.9rem}
.camps{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.camp{display:block;background:#fff;border-radius:26px;overflow:hidden;border:1px solid var(--line);transition:.5s var(--ease);opacity:0;animation:up .9s var(--ease) forwards}
.camp:hover{transform:translateY(-8px);box-shadow:0 30px 60px -24px rgba(0,0,0,.22)}
.camp-cover{aspect-ratio:16/9;position:relative;overflow:hidden;background:color-mix(in srgb,var(--c) 18%,#fff)}
.camp-cover img,.camp-cover video{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.camp:hover .camp-cover img{transform:scale(1.05)}
.camp-cover .ph-ic{position:absolute;inset:0;display:grid;place-items:center;color:var(--c);opacity:.6}
.camp-cover .ph-ic svg{width:36px;height:36px}
.camp-cover .type{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);padding:5px 12px;border-radius:100px;font-size:.75rem}
.camp-body{padding:24px 26px 26px;display:flex;justify-content:space-between;align-items:end;gap:16px}
.camp-body h3{font-size:1.2rem;font-weight:600;margin-bottom:6px}
.camp-body p{font-size:.9rem;color:var(--muted);line-height:1.8}
.arrow{flex-shrink:0;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:.4s var(--ease)}
.camp:hover .arrow{background:var(--c);border-color:var(--c);color:#fff;transform:rotate(-45deg)}

.brand-nav{display:flex;justify-content:space-between;gap:16px;margin-top:80px;padding-top:30px;border-top:1px solid var(--line)}
.brand-nav a{display:flex;flex-direction:column;gap:4px;padding:18px 22px;border-radius:20px;transition:.3s;min-width:0}
.brand-nav a:hover{background:var(--card)}
.brand-nav small{color:var(--muted);font-size:.8rem}
.brand-nav b{font-size:1.1rem;font-weight:600}
.brand-nav .next{text-align:left;margin-inline-start:auto}

/* ---------- Campaign page ---------- */
.camp-hero{display:grid;grid-template-columns:1.1fr 1fr;gap:60px;align-items:start;padding-bottom:50px}
.camp-hero h1{font-size:clamp(2rem,4.5vw,3.2rem);font-weight:700;line-height:1.3}
.camp-meta{display:flex;gap:28px;flex-wrap:wrap;margin-top:24px;font-size:.9rem}
.camp-meta div span{display:block;color:var(--muted);font-size:.78rem}
.detail{background:#fff;border:1px solid var(--line);border-radius:26px;padding:30px}
.detail .row{padding:18px 0;border-bottom:1px solid var(--line)}
.detail .row:first-child{padding-top:0}
.detail .row:last-child{border:none;padding-bottom:0}
.detail h4{font-size:.8rem;color:var(--muted);font-weight:500;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.detail h4::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.detail p{line-height:1.95;color:#3A3A3C;font-size:.98rem}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:56px}
.result{border-radius:22px;padding:24px;background:var(--c);color:#fff}
.result b{font-family:'Inter';font-size:2rem;font-weight:600;display:block;direction:ltr;text-align:right}
.result span{font-size:.85rem;opacity:.9}
.gallery-head{font-size:1.3rem;font-weight:600;margin-bottom:20px;display:flex;justify-content:space-between;align-items:baseline}
.gallery-head span{color:var(--muted);font-size:.85rem;font-weight:400}
.gallery{columns:3 260px;column-gap:16px}
.g-item{break-inside:avoid;margin-bottom:16px;border-radius:20px;overflow:hidden;background:color-mix(in srgb,var(--c) 14%,#fff);position:relative;cursor:zoom-in;transition:.4s var(--ease)}
.g-item:hover{transform:scale(.985)}
.g-item img,.g-item video{width:100%;height:auto}
.g-item.vid{cursor:default}
.g-ph{display:grid;place-items:center;color:var(--c);font-size:.85rem;gap:6px;text-align:center}
.g-ph svg{width:28px;height:28px}
.g-cap{position:absolute;bottom:0;inset-inline:0;padding:30px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-size:.82rem;opacity:0;transition:.3s}
.g-item:hover .g-cap{opacity:1}
.camp-nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:70px;padding-top:30px;border-top:1px solid var(--line)}

.hl-list{counter-reset:h;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:56px}
.hl{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px 26px;position:relative}
.hl::before{counter-increment:h;content:counter(h,decimal-leading-zero);font-family:'Inter';font-size:.78rem;color:var(--c);font-weight:600;letter-spacing:1px}
.hl h4{font-size:1.05rem;font-weight:600;margin:8px 0 6px}
.hl p{font-size:.93rem;color:var(--muted);line-height:1.95}
.sub-head{font-size:1.3rem;font-weight:600;margin-bottom:20px}
@media(max-width:680px){.hl-list{grid-template-columns:1fr}}
/* ---------- Campaign v2 ---------- */
.cv-hero{display:grid;grid-template-columns:1.15fr .85fr;gap:70px;align-items:center;padding:20px 0 90px}
.cv-eyebrow{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--muted);margin-bottom:18px}
.cv-eyebrow i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.cv-title{font-size:clamp(2.3rem,5.4vw,4.2rem);font-weight:700;line-height:1.18;letter-spacing:-1px}
.cv-tag{display:inline-block;margin-top:18px;padding:8px 18px;border-radius:100px;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);font-weight:600;font-size:1rem;border:1px solid color-mix(in srgb,var(--c) 22%,transparent)}
.cv-sum{font-size:1.12rem;line-height:2.1;color:#30353C;margin-top:24px;max-width:620px}
.cv-meta{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:12px 40px;margin-top:34px;padding-top:26px;border-top:1px solid var(--line)}
.cv-meta span{display:block;font-size:.75rem;color:var(--soft);margin-bottom:4px;letter-spacing:.5px}
.cv-meta b{font-weight:500;font-size:.95rem}
.cv-role{margin-top:26px;padding:18px 22px;border-radius:18px;background:var(--card);border-right:3px solid var(--c);font-size:.95rem;line-height:1.9;color:#30353C}
.cv-role small{display:block;color:var(--c);font-weight:600;font-size:.78rem;margin-bottom:4px}
.phone{position:relative;justify-self:center;width:min(340px,100%);aspect-ratio:9/16;border-radius:38px;padding:10px;background:#0B0B0C;box-shadow:0 40px 80px -30px color-mix(in srgb,var(--c) 60%,#000),0 0 0 1px rgba(0,0,0,.1)}
.phone.wide{aspect-ratio:16/10;width:100%;border-radius:24px}
.phone video,.phone img{width:100%;height:100%;object-fit:cover;border-radius:30px;background:#111}
.phone.wide video{border-radius:16px}
.phone::before{content:"";position:absolute;inset:-40px;z-index:-1;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 30%,transparent),transparent 70%);filter:blur(30px)}
.sound{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:100px;border:none;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);font-size:.85rem;font-weight:500;color:#0B0B0C;box-shadow:0 8px 20px rgba(0,0,0,.25);transition:.3s}
.sound:hover{transform:translateX(-50%) scale(1.05)}
.cv-steps{display:grid;grid-template-columns:.75fr 1.25fr;gap:70px;padding:90px 0;border-top:1px solid var(--line)}
.cv-steps-head{position:sticky;top:150px;align-self:start}
.cv-steps-head h2{font-size:clamp(1.8rem,3.6vw,2.6rem);font-weight:700;line-height:1.3}
.cv-steps-head p{color:var(--muted);margin-top:12px;line-height:1.9}
.cv-steps-head .big{font-family:'Inter';font-size:5rem;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:1.5px color-mix(in srgb,var(--c) 55%,transparent);margin-top:22px}
.step{display:grid;grid-template-columns:64px 1fr;gap:22px;padding:28px 0;border-bottom:1px solid var(--line);position:relative}
.step:first-child{border-top:1px solid var(--line)}
.step::after{content:"";position:absolute;bottom:-1px;right:0;height:2px;width:0;background:var(--c);transition:width .8s var(--ease)}
.step:hover::after{width:100%}

/* ---------- Router ---------- */
const SECS = ["home","services","work","contact"];
let onMain = false, spyLock = false;
function scrollToSec(sec, smooth=true){
  const el = document.getElementById("s-"+sec); if(!el) return;
  const y = sec==="home" ? 0 : el.getBoundingClientRect().top + scrollY - 60;
  spyLock = true; setActive(sec);
  if (window.lenis) lenis.scrollTo(y,{duration:smooth?1.4:0,immediate:!smooth,onComplete:()=>spyLock=false});
  else { window.scrollTo({top:y,behavior:smooth?"smooth":"instant"}); setTimeout(()=>spyLock=false,900); }
}
function setActive(sec){
  document.querySelectorAll(".menu a").forEach(a=>a.classList.toggle("active",a.dataset.r===sec));
  document.querySelectorAll("#dots a").forEach(a=>a.classList.toggle("on",a.dataset.s===sec));
}
function render(){
  const h = location.hash.replace(/^#\/?/,"");
  let parts;
  if (h.startsWith("c-")) { const [bid,cid]=h.slice(2).split("--"); parts=["work",bid,cid]; }
  else if (h.startsWith("b-")) parts=["work",h.slice(2)];
  else parts = h.split("/").filter(Boolean);
  const route = parts[0] || "home";
  document.getElementById("menu").classList.remove("open");
  if (SECS.includes(route) && !parts[1]){
    document.title = `${ME.name} | ${ME.role}`;
    if (!onMain){
      app.innerHTML = `<div class="page">${pages.main()}</div>`;
      onMain = true; initMain();
      requestAnimationFrame(()=>scrollToSec(route,false));
    } else scrollToSec(route);
    return;
  }
  onMain = false;
  let html;
  if (route==="work" && parts[1]){
    const b = BRANDS.find(x=>x.id===parts[1]);
    const c = b && parts[2] ? b.campaigns.find(x=>x.id===parts[2]) : null;
    html = !b ? pages.notFound() : parts[2] ? (c ? pages.campaign(b,c) : pages.notFound()) : pages.brand(b);
    document.title = `${ME.name} | ${c?c.name:b?b.name:"أعمالي"}`;
  } else html = pages.notFound();
  app.innerHTML = `<div class="page">${html}</div>`;
  document.getElementById("dots").innerHTML = "";
  if (window.lenis) lenis.scrollTo(0,{immediate:true}); else window.scrollTo({top:0,behavior:"instant"});
  setActive("work");
  observeReveal();
  initCampaign();
}
window.addEventListener("hashchange", render);

/* reveal on scroll */
let revealIO;
function observeReveal(){
  if(!('IntersectionObserver' in window)){ document.querySelectorAll('.rv').forEach(e=>e.classList.add('in')); return; }
  setTimeout(()=>document.querySelectorAll('.camp2.rv,.track-x.rv,.cv-gal-head.rv').forEach(e=>e.classList.add('in')),2500);
  revealIO && revealIO.disconnect();
  revealIO = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); revealIO.unobserve(e.target);} }),{threshold:.12,rootMargin:"0px 0px -6% 0px"});
  document.querySelectorAll(".rv:not(.in)").forEach(el=>revealIO.observe(el));
}
function initMain(){
  observeReveal();
  const secs = [...document.querySelectorAll("[data-sec]")];
  document.getElementById("dots").innerHTML = secs.map(s=>`<a href="#${s.dataset.sec}" data-s="${s.dataset.sec}"><i></i>${s.dataset.label}</a>`).join("");
  const spy = new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting && !spyLock){
      const sec=e.target.dataset.sec; setActive(sec);
      history.replaceState(null,"","#"+sec);
    }
    
  }),{rootMargin:"-45% 0px -45% 0px",threshold:0});
  secs.forEach(s=>spy.observe(s));
  setTimeout(()=>document.getElementById("s-home")?.classList.add("on-screen"),50);
  const hero = document.getElementById("s-home"), glow = document.getElementById("glow");
  const moveGlow = (x,y)=>{ if(glow) glow.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%)`; };
  moveGlow(hero.offsetWidth*.75, hero.offsetHeight*.35);
  hero.addEventListener("pointermove", e=>{ const r=hero.getBoundingClientRect(); moveGlow(e.clientX-r.left, e.clientY-r.top); });
}

/* scroll progress + header */
function onScroll(){
  const h = document.documentElement.scrollHeight - innerHeight;
  document.getElementById("prog").style.transform = `scaleX(${h>0?scrollY/h:0})`;
  document.getElementById("hdr").classList.toggle("solid", scrollY>20);
  const hero = document.querySelector(".hero2 .wrap");
  if (hero && scrollY < innerHeight) { hero.style.transform = `translateY(${scrollY*.18}px)`; hero.style.opacity = 1 - scrollY/innerHeight*.9; }
}
window.addEventListener("scroll", onScroll, {passive:true});

/* intro */
(function intro(){
  const el = document.getElementById("intro"), orb = document.getElementById("orb");
  let done=false, ready=false, t0=performance.now();
  document.body.classList.add("locked");
  let ox=innerWidth/2, oy=innerHeight/2;
  orb.style.transform=`translate(${ox}px,${oy}px) translate(-50%,-50%)`;
  el.addEventListener("pointermove", e=>{ orb.style.transform=`translate(${e.clientX}px,${e.clientY}px) translate(-50%,-50%)`; });
  const ringPos = (x,y)=>{ const r=el.querySelector(".ring"); r.style.left=x+"px"; r.style.top=y+"px"; r.style.transform="translate(-50%,-50%)"; };
  ringPos(innerWidth/2, innerHeight/2);
  setTimeout(()=>{ ready=true; el.classList.add("ready"); setTimeout(()=>enter(),2600); },1100);
  function enter(e){
    if(done||!ready) return; done=true;
    if(e && e.clientX!=null) ringPos(e.clientX,e.clientY);
    el.classList.add("expand");
    setTimeout(()=>{ el.classList.add("done"); document.body.classList.remove("locked"); window.lenis&&lenis.start(); document.getElementById("s-home")?.classList.add("on-screen"); },650);
    setTimeout(()=>el.remove(),1800);
  }
  el.addEventListener("click", enter);
  el.addEventListener("wheel", ()=>enter(), {passive:true});
  el.addEventListener("touchmove", ()=>enter(), {passive:true});
  addEventListener("keydown", e=>{ if(["Enter"," ","ArrowDown"].includes(e.key)) enter(); });
})();

/* smooth scroll (Lenis) — falls back to native if unavailable */
(function(){
  const sc=document.createElement("script"); sc.src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js";
  sc.onload=()=>{ try{ window.lenis=new Lenis({duration:1.15,smoothWheel:true}); const raf=t=>{lenis.raf(t);requestAnimationFrame(raf)}; requestAnimationFrame(raf); lenis.on("scroll",onScroll); if(document.body.classList.contains("locked")) lenis.stop();}catch(e){} };
  document.head.appendChild(sc);
})();

function lbShow(i){ LB.i=(i+LB.items.length)%LB.items.length; const it=LB.items[LB.i]; const im=document.getElementById("lbImg"); im.style.opacity=0; setTimeout(()=>{im.src=it.src; im.style.opacity=1;},120); document.getElementById("lbCap").innerHTML=`<span dir="ltr">${LB.i+1} / ${LB.items.length}</span>${it.caption?" · "+it.caption:""}`; }
function initCampaign(){
  const sw=document.querySelector('.sw.on'); if(sw){ const w=sw.parentElement; w.scrollLeft = sw.offsetLeft - w.clientWidth/2 + sw.offsetWidth/2; }
  const gal=document.getElementById("gal");
  if(gal){
    const [bid,cid]=location.hash.replace(/^#c-/,"").split("--"); const b=BRANDS.find(x=>x.id===bid); const c=b&&b.campaigns.find(x=>x.id===cid);
    LB.items = c ? c.media.filter(m=>m.type==="image"&&m.src) : [];
    let down=false,sx=0,sl=0,moved=0;
    gal.addEventListener("pointerdown",e=>{down=true;moved=0;sx=e.clientX;sl=gal.scrollLeft;gal.classList.add("drag");});
    addEventListener("pointerup",()=>{down=false;gal.classList.remove("drag");});
    gal.addEventListener("pointermove",e=>{if(!down)return; const dx=e.clientX-sx; moved=Math.max(moved,Math.abs(dx)); gal.scrollLeft=sl-dx;});
    gal.addEventListener("click",e=>{const im=e.target.closest("[data-lb]"); if(im&&moved<6){lbShow(+im.dataset.lb);document.getElementById("lb").classList.add("open");}});
    document.querySelectorAll("[data-gal]").forEach(bt=>bt.onclick=()=>gal.scrollBy({left:-(+bt.dataset.gal)*gal.clientWidth*.8,behavior:"smooth"}));
  }
  document.querySelectorAll("[data-sound]").forEach(bt=>bt.onclick=e=>{e.preventDefault(); const v=bt.parentElement.querySelector("video"); v.muted=false; v.controls=true; v.currentTime=0; v.play(); bt.remove();});
  document.querySelectorAll(".camp2").forEach(card=>{ const v=card.querySelector("video"); if(!v) return;
    card.addEventListener("mouseenter",()=>{v.preload="auto"; v.play().catch(()=>{});}); card.addEventListener("mouseleave",()=>{v.pause();}); });
}
document.getElementById("lbPrev").onclick=e=>{e.stopPropagation();lbShow(LB.i-1);};
document.getElementById("lbNext").onclick=e=>{e.stopPropagation();lbShow(LB.i+1);};
addEventListener("keydown",e=>{ if(!document.getElementById("lb").classList.contains("open"))return; if(e.key==="ArrowLeft")lbShow(LB.i+1); if(e.key==="ArrowRight")lbShow(LB.i-1); });

/* Folder click → open animation → navigate */
app.addEventListener("click", e=>{
  const f = e.target.closest(".folder");
  if (f){
    f.classList.add("opening");
    setTimeout(()=>{ location.hash = `#b-${f.dataset.brand}`; }, 480);
    return;
  }
  const z = e.target.closest("[data-zoom]");
  if (z){ document.getElementById("lbImg").src = z.dataset.zoom; document.getElementById("lb").classList.add("open"); }
});
const closeLb = ()=>document.getElementById("lb").classList.remove("open");
document.getElementById("lbClose").onclick = closeLb;
document.getElementById("lb").onclick = e=>{ if(e.target.id==="lb") closeLb(); };
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeLb(); });

document.getElementById("burger").onclick = ()=>document.getElementById("menu").classList.toggle("open");
document.getElementById("yr").textContent = new Date().getFullYear();
render();
</script>
</body>
